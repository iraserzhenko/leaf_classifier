[project]
name = "leaf-classifier"
version = "0.1.0"
description = "Plant disease classification from leaf images using CNN with SE-attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "lightning>=2.1.0",
    "torchmetrics>=1.2.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "mlflow>=2.9.0",
    "dvc>=3.30.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "fire>=0.5.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "onnxscript>=0.1.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
triton = ["tritonclient[http]>=2.40.0"]
kaggle = ["kaggle>=1.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leaf_classifier"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["leaf_classifier"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
